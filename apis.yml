aid: alva-energy
name: Alva Energy
description: 'Alva Energy is a nuclear technology company rewriting the economics of nuclear
  deployment to deliver gigawatts of clean power in years, not decades. Rather than building
  new reactors, Alva productizes capacity upgrades ("uprates") for the existing U.S. reactor
  fleet: the Alva Uprate combines advanced steam generators with improved heat transfer,
  a second turbine plant (2TGP) sited outside the protected area, and the DUO-SYNC digital
  control system, adding roughly 250-300 MWe per reactor as a fixed-price, turnkey project
  deployable in under two years and targeting 10 GWe across the fleet. The company launched
  in February 2026 with $33 million in funding led by Playground Global to meet surging
  power demand from AI and industrial load. This profile was surfaced as a portfolio company
  of playground-global and added to the API Evangelist network; Alva Energy publishes a
  marketing and news presence but no public developer, API, or SDK surface at this time.'
